# auxspire.com – main site (Node.js app)
# Copy to VPS: /etc/nginx/sites-available/auxspire-app
# Then: ln -s /etc/nginx/sites-available/auxspire-app /etc/nginx/sites-enabled/
# nginx -t && systemctl reload nginx
# SSL: certbot --nginx -d auxspire.com -d www.auxspire.com

# 72.61.227.53 in server_name so http://72.61.227.53 works when DNS points elsewhere
server {
    listen 80;
    server_name auxspire.com www.auxspire.com 72.61.227.53;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
