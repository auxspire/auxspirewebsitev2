<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Auxspire article">
  <link rel="canonical" href="https://auxspire.com/blog/">
  <meta property="og:site_name" content="Auxspire">
  <meta property="og:type" content="article">
  <meta property="og:image" content="https://auxspire.com/stitch/logo.png">
  <meta name="twitter:card" content="summary_large_image">
  <title>Article | Auxspire</title>
  <link rel="icon" href="/stitch/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/design-system.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/animations.css">
  <link rel="stylesheet" href="/assets/css/textures.css">
  <link rel="stylesheet" href="/assets/css/abstract-elements.css">
  <link rel="stylesheet" href="/assets/css/pages.css">
  <link rel="stylesheet" href="/assets/css/blog.css">
</head>
<body class="theme-dark">
  <div class="scroll-progress" aria-hidden="true"></div>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <header class="site-header">
    <div class="container">
      <nav class="site-nav">
        <a href="/" class="site-logo">
          <img src="/stitch/logo.png" alt="AUXSPIRE" height="48">
        </a>
        <div class="nav-overlay" id="navOverlay" aria-hidden="true"></div>
        <div class="nav-links" id="navLinks">
          <a href="/#services">Services</a>
          <a href="/about-us/">About</a>
          <a href="/case-studies/">Case Studies</a>
          <a href="/blog/" aria-current="page">Blog</a>
          <a href="/#why">Why Auxspire</a>
          <a href="/contact/">Contact</a>
          <a href="/client-portal/">Client Portal</a>
        </div>
        <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">
          <span class="material-symbols-outlined">menu</span>
        </button>
      </nav>
    </div>
  </header>

  <main id="main-content">
    <article class="blog-article animate-section">
      <div class="container container--narrow" id="blog-article">
        <p class="blog-feed__status">Loading article…</p>
      </div>
    </article>
  </main>

  <footer class="site-footer">
    <div class="container">
      <nav class="footer-links">
        <a href="/">Home</a>
        <a href="/about-us/">About</a>
        <a href="/case-studies/">Case Studies</a>
        <a href="/blog/">Blog</a>
        <a href="/contact/">Contact</a>
        <a href="/client-portal/">Client Portal</a>
      </nav>
      <p class="footer-tagline">Salesforce delivery across APAC, MENA, Europe, and North America</p>
      <p>&copy; Auxspire | Empowering Enterprise Intelligence</p>
    </div>
  </footer>

  <script src="/assets/js/content-feed/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="/assets/js/content-feed/client.js"></script>
  <script src="/assets/js/content-feed/render.js"></script>
  <script src="/assets/js/site.js" defer></script>
  <script>
    (function () {
      function slugFromPath() {
        var parts = location.pathname.replace(/\/+$/, "").split("/");
        var blogIdx = parts.indexOf("blog");
        if (blogIdx >= 0 && parts[blogIdx + 1]) return decodeURIComponent(parts[blogIdx + 1]);
        var q = new URLSearchParams(location.search).get("slug");
        return q || "";
      }

      function setMeta(post) {
        var title = (post.seo_title || post.title) + " | Auxspire";
        var desc = post.seo_description || post.excerpt || post.title;
        var url = "https://auxspire.com/blog/" + post.slug;
        document.title = title;
        var descEl = document.querySelector('meta[name="description"]');
        if (descEl) descEl.setAttribute("content", desc);
        var canonical = document.querySelector('link[rel="canonical"]');
        if (canonical) canonical.setAttribute("href", url);
        function setOg(prop, value) {
          var el = document.querySelector('meta[property="' + prop + '"]');
          if (!el) {
            el = document.createElement("meta");
            el.setAttribute("property", prop);
            document.head.appendChild(el);
          }
          el.setAttribute("content", value);
        }
        setOg("og:title", title);
        setOg("og:description", desc);
        setOg("og:url", url);
        if (post.cover_image_url) setOg("og:image", post.cover_image_url);
      }

      var slug = slugFromPath();
      var root = document.getElementById("blog-article");
      if (!slug) {
        root.innerHTML =
          '<p class="blog-feed__status">Article not found. <a href="/blog/">Back to blog</a></p>';
        return;
      }

      ContentFeed.getPost(slug)
        .then(function (data) {
          var post = data.post;
          if (!post) {
            root.innerHTML =
              '<p class="blog-feed__status">Article not found. <a href="/blog/">Back to blog</a></p>';
            return;
          }
          setMeta(post);
          var author = post.author && post.author.name ? ContentFeedRender.escapeHtml(post.author.name) : "";
          var meta = [
            ContentFeedRender.formatDate(post.published_at),
            post.read_minutes ? post.read_minutes + " min read" : "",
            author,
          ]
            .filter(Boolean)
            .join(" · ");
          var cover = post.cover_image_url
            ? '<div class="blog-article__cover"><img src="' +
              ContentFeedRender.escapeHtml(post.cover_image_url) +
              '" alt=""></div>'
            : "";
          root.innerHTML =
            '<p class="blog-article__back"><a href="/blog/">&larr; Back to blog</a></p>' +
            (post.category
              ? '<p class="blog-card__category">' + ContentFeedRender.escapeHtml(post.category) + "</p>"
              : "") +
            "<h1 class=\"gradient-headline\">" +
            ContentFeedRender.escapeHtml(post.title) +
            "</h1>" +
            (meta ? '<p class="blog-card__meta">' + ContentFeedRender.escapeHtml(meta) + "</p>" : "") +
            cover +
            '<div class="blog-article__body prose">' +
            ContentFeedRender.markdownToHtml(post.body_markdown) +
            "</div>";
        })
        .catch(function (err) {
          console.error(err);
          root.innerHTML =
            '<p class="blog-feed__status">Unable to load this article. <a href="/blog/">Back to blog</a></p>';
        });
    })();
  </script>
</body>
</html>
