<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Circuit Pulse</title>
  <style>
    html, body { margin:0; height:100%; background:#071021; overflow:hidden; }
    canvas { display:block; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");

    function resize() {
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      canvas.width = Math.floor(window.innerWidth * dpr);
      canvas.height = Math.floor(window.innerHeight * dpr);
      canvas.style.width = window.innerWidth + "px";
      canvas.style.height = window.innerHeight + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener("resize", resize);
    resize();

    // Build some PCB-like paths
    function rnd(min, max) { return Math.random() * (max - min) + min; }
    function makePath() {
      let x = rnd(60, window.innerWidth - 60);
      let y = rnd(60, window.innerHeight - 60);
      const pts = [{x, y}];
      for (let i = 0; i < 6; i++) {
        if (Math.random() > 0.5) x += (Math.random() > 0.5 ? 1 : -1) * rnd(60, 160);
        else y += (Math.random() > 0.5 ? 1 : -1) * rnd(60, 160);
        x = Math.max(40, Math.min(window.innerWidth - 40, x));
        y = Math.max(40, Math.min(window.innerHeight - 40, y));
        pts.push({x, y});
      }
      return pts;
    }

    const paths = Array.from({length: 14}, makePath);

    // Precompute lengths for each path
    const prepared = paths.map(pts => {
      let segs = [];
      let total = 0;
      for (let i = 0; i < pts.length - 1; i++) {
        const a = pts[i], b = pts[i+1];
        const len = Math.hypot(b.x - a.x, b.y - a.y);
        segs.push({a, b, len});
        total += len;
      }
      return { pts, segs, total };
    });

    function pointOn(prep, dist) {
      let d = ((dist % prep.total) + prep.total) % prep.total;
      for (const s of prep.segs) {
        if (d <= s.len) {
          const t = s.len === 0 ? 0 : d / s.len;
          return { x: s.a.x + (s.b.x - s.a.x) * t, y: s.a.y + (s.b.y - s.a.y) * t };
        }
        d -= s.len;
      }
      // fallback
      const last = prep.pts[prep.pts.length - 1];
      return { x: last.x, y: last.y };
    }

    function drawBackground() {
      const g = ctx.createLinearGradient(0, 0, 0, window.innerHeight);
      g.addColorStop(0, "#0b1a35");
      g.addColorStop(1, "#071021");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
    }

    function drawPaths() {
      ctx.lineWidth = 2;
      ctx.strokeStyle = "rgba(0,180,255,0.25)";
      ctx.shadowColor = "rgba(0,220,255,0.35)";
      ctx.shadowBlur = 10;

      for (const p of prepared) {
        ctx.beginPath();
        ctx.moveTo(p.pts[0].x, p.pts[0].y);
        for (const pt of p.pts) ctx.lineTo(pt.x, pt.y);
        ctx.stroke();
      }
      ctx.shadowBlur = 0;
    }

    function drawNodes() {
      ctx.shadowBlur = 14;
      ctx.shadowColor = "rgba(0,255,255,0.9)";
      for (const p of prepared) {
        for (const pt of p.pts) {
          ctx.beginPath();
          ctx.fillStyle = "rgba(0,200,255,0.85)";
          ctx.arc(pt.x, pt.y, 2.8, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.shadowBlur = 0;
    }

    function drawPulse(x, y, r, fill) {
      ctx.beginPath();
      ctx.fillStyle = fill;
      ctx.shadowColor = fill;
      ctx.shadowBlur = 22;
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    let last = performance.now();
    let t = 0;

    function loop(now) {
      const dt = (now - last) / 1000;
      last = now;
      t += dt;

      drawBackground();
      drawPaths();
      drawNodes();

      // Animate pulses
      const speed = 220; // px/sec
      prepared.forEach((p, i) => {
        const base = t * speed + i * 80;
        const a = pointOn(p, base);
        const b = pointOn(p, base - 140);

        drawPulse(a.x, a.y, 5.2, "rgba(0,255,255,1)");
        drawPulse(b.x, b.y, 3.8, "rgba(80,255,200,0.95)");
      });

      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
